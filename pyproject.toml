[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paint-ascii"
version = "1.0.0"
description = "Editor de mockups TUI estilo nano + conversor JPG a ASCII"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "pillow>=10",
]

[project.scripts]
paintui = "paint_ascii.__main__:main"

[tool.setuptools]
packages = ["paint_ascii"]
